name: Publish Package to npmjs
run-name: ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v3.4.0)"
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      # Ensure npm supports trusted publishing through GitHub Actions OIDC.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm publish --provenance --access public
